[project]
name = "call-it-what-you-want"
version = "0.1.0"
description = "Translate between names and ID schemes for sports teams/athletes/etc."
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = []

# The CLI is for getting locally recorded rows back into the package, so
# it's opt-in -- callers who only translate names don't need fire.
[project.optional-dependencies]
cli = ["fire>=0.7.0"]

[project.scripts]
ciwyw = "call_it_what_you_want.cli:main"

[dependency-groups]
dev = [
    "fire>=0.7.0",
    "ipykernel>=6.29.5",
    "pytest>=8.3.5",
    "ruff>=0.16.1",
    "ty>=0.0.65",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_it_what_you_want"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
