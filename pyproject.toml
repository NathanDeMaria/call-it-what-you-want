[project]
name = "call-it-what-you-want"
version = "0.1.0"
description = "Translate between names and ID schemes for sports teams/athletes/etc."
readme = "README.md"
authors = []
# The oldest Python this supports, not the one it's developed on: a library
# that asks for a newer interpreter than its consumers run can't be installed.
requires-python = ">=3.14"
dependencies = []

# The CLI is for getting locally recorded rows back into the package, so
# it's opt-in -- callers who only translate names don't need fire.
#
# `sync` is for building the knowledge base rather than reading it: it hits
# ESPN over the network and reads stored seasons. Kept out of the base
# install so translating a name stays a dependency-free operation, which is
# what lets a serving image depend on this package without pulling an HTTP
# stack in. `imports_test.py` is what keeps that true.
[project.optional-dependencies]
cli = ["fire>=0.7.0"]
sync = [
    "aiohttp>=3.8",
    # Reading the stored seasons a sync reconciles names against. Brings
    # `endgame` (and aiobotocore) with it.
    "endgame-aws",
]

[project.scripts]
ciwyw = "call_it_what_you_want.cli:main"

# endgame-aws isn't published anywhere -- it's a subdirectory of the EndGame
# repo, so it needs an explicit source or resolution fails outright. At least
# b336c04 (EndGame #120), the first rev that lets pyarrow reach 26 -- the
# first pyarrow with wheels for Python 3.15.
[tool.uv.sources]
endgame-aws = { git = "https://github.com/NathanDeMaria/EndGame.git", rev = "b336c0490ca34b49b355bbce372a0d3998c4fbf2", subdirectory = "py-endgame-aws" }

[dependency-groups]
dev = [
    # Both extras in the working environment: their modules and tests are
    # part of this repo even though consumers opt in, so `uv sync` (and CI)
    # has to be able to import them. uv has no `default-extras`, and a self
    # reference in a default group is the supported way to say it.
    "call-it-what-you-want[cli,sync]",
    "ipykernel>=6.29.5",
    "pytest>=9.0.2",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["call_it_what_you_want"]

# Below here is the template's. `copier update` brings changes to it from
# mirrorball, so per-repo additions are better made as new keys than as edits.

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# Ruff's defaults (E4, E7, E9, F), import sorting, and pyupgrade -- which
# reads requires-python to decide what's outdated.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["call_it_what_you_want"]

[tool.ty.terminal]
# A warning fails `make check` and CI, same as an error. Silence one on purpose
# with `# ty: ignore[rule]`, which ty itself flags once it's no longer needed.
error-on-warning = true

[tool.pytest]
# Unknown markers, bad config keys and xfails that pass are failures.
strict = true

[tool.ruff.lint.per-file-ignores]
# these just re-export names for the public API
"__init__.py" = ["F401"]
