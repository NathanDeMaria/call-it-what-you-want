name: Lint and test

on:
  # "**" rather than "*" so branch names with a slash in them still match.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    # --all-extras: the `sync` extra is opt-in for consumers, but its modules
    # and their tests are part of this repo, so CI has to be able to import them.
    - name: Install dependencies
      run: uv sync --locked --all-extras
    - name: ruff format --check
      run: uv run ruff format --check .
    - name: ruff check
      run: uv run ruff check .
    - name: ty check
      run: uv run ty check .

  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    # --all-extras: the `sync` extra is opt-in for consumers, but its modules
    # and their tests are part of this repo, so CI has to be able to import them.
    - name: Install dependencies
      run: uv sync --locked --all-extras
    - name: pytest
      run: uv run pytest
